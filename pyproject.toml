[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covalent-generation"
version = "0.1.0"
description = "A small, extensible workflow for covalent molecule generation and docking."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Covalent Generation contributors" }]
dependencies = []

[project.scripts]
covalent-generation = "covalent_generation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
